name: Verify neural-network optimization
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m minimal_neural_network.check_gradients
      - run: python -m pytest -q
      - run: python -m minimal_neural_network.run_experiment
